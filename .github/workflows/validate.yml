name: Validate data

on:
  push:
    paths: ["data/**", "tools/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "tools/**", ".github/workflows/validate.yml"]
  schedule:
    # Monday 05:00 UTC - catches ISO 4217 withdrawals and new tzdb releases
    # before someone notices them in production.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tzdata
        run: pip install tzdata

      - name: Validate data files
        run: python3 tools/validate.py

      - name: Check minified files are in sync
        run: python3 tools/minify.py --check

      - name: Report file sizes
        if: always()
        run: |
          {
            echo "| File | Pretty | Minified |"
            echo "| --- | ---: | ---: |"
            for f in data/*.json; do
              case "$f" in *.min.json) continue;; esac
              m="${f%.json}.min.json"
              printf '| `%s` | %s | %s |\n' \
                "$(basename "$f")" \
                "$(numfmt --to=iec --suffix=B "$(stat -c%s "$f")")" \
                "$([ -f "$m" ] && numfmt --to=iec --suffix=B "$(stat -c%s "$m")" || echo '-')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
